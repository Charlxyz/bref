<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mini Jeu Bourse</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">

<div class="bg-white shadow-xl rounded-2xl p-8 w-full max-w-2xl">

    <!-- Titre -->
    <h1 class="text-3xl font-bold text-center mb-6">Simulation de Bourse</h1>

    <!-- Informations principales -->
    <div class="grid grid-cols-2 gap-4 mb-6">

        <div class="bg-gray-50 p-4 rounded-xl text-center">
            <p class="text-gray-500">Jour</p>
            <p class="text-xl font-semibold">{{ JOUR }}</p>
        </div>

        <div class="bg-gray-50 p-4 rounded-xl text-center">
            <p class="text-gray-500">Prix de l'action</p>
            <p class="text-xl font-semibold">{{ PRIX_ACTION }} €</p>
        </div>

        <div class="bg-gray-50 p-4 rounded-xl text-center">
            <p class="text-gray-500">Solde</p>
            <p class="text-xl font-semibold text-green-600">{{ SOLDE }} €</p>
        </div>

        <div class="bg-gray-50 p-4 rounded-xl text-center">
            <p class="text-gray-500">Actions détenues</p>
            <p class="text-xl font-semibold">{{ NB_ACTIONS }}</p>
        </div>

    </div>

    <!-- Formulaire Achat/Vente -->
    <div class="bg-gray-50 p-6 rounded-xl mb-6">

        <h2 class="text-lg font-semibold mb-4 text-center">Transactions</h2>

        <form class="flex flex-col gap-4">

            <!-- Nombre d'actions -->
            <div>
                <label class="block text-sm text-gray-600 mb-1">
                    Nombre d'actions
                </label>
                <input 
                    type="number" 
                    placeholder="Ex: 5"
                    class="w-full p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400"
                >
            </div>

            <!-- Boutons -->
            <div class="flex justify-between gap-4">
                <button class="w-full bg-green-500 hover:bg-green-600 text-white py-2 rounded-lg">
                    Acheter
                </button>

                <button class="w-full bg-red-500 hover:bg-red-600 text-white py-2 rounded-lg">
                    Vendre
                </button>
            </div>

        </form>
    </div>

    <!-- Jour suivant -->
    <div class="text-center">
        <button class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-3 rounded-xl text-lg">
            Passer au jour suivant
        </button>
    </div>

</div>

</body>
</html>
